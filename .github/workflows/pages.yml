name: 发布到 GitHub Pages

# 当前走「分支部署」(Settings > Pages > Deploy from a branch)，纯静态站没有构建步骤。
# 这里只保留手动触发；将来若要加构建（比如预生成城市索引），
# 把 Pages 源切回 GitHub Actions 并恢复 push 触发即可。
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true 让 action 自动启用仓库的 Pages，省掉手动在 Settings 里选源
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
